services:
  - type: web
    name: teckup-staging-api
    runtime: node
    plan: free
    branch: develop
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_xn2LuvorXUB9@ep-shiny-cake-aisparmt-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false

  - type: web
    name: teckup-production-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
