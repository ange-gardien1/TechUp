services:
  - type: web
    name: teckup-staging-api
    runtime: node
    plan: free
    branch: develop
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false

  - type: web
    name: teckup-production-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
